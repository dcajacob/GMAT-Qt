name: Marketing Screenshots

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to capture screenshots from'
        required: true
        default: 'v0.1.0-alpha.5'
        type: string
  push:
    branches:
      - 'cursor/screenshots-workflow-08fd'

permissions:
  contents: read

jobs:
  screenshot-linux:
    name: Screenshot Linux x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install desktop environment and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            xfce4 \
            xfce4-terminal \
            xfwm4 \
            scrot \
            mesa-utils \
            libgl1-mesa-dri \
            libglx-mesa0 \
            wget \
            imagemagick \
            wmctrl \
            x11-utils \
            tesseract-ocr \
            xdotool
          
      - name: Download Linux release package
        run: |
          TAG="${{ inputs.release_tag || 'v0.1.0-alpha.5' }}"
          VERSION="${TAG#v}"
          wget -O gmat-qt.tar.gz \
            "https://github.com/dcajacob/GMAT-Qt/releases/download/$TAG/GMAT-Qt-$VERSION-linux-x86_64.tar.gz"
          
      - name: Extract package
        run: |
          tar -xzf gmat-qt.tar.gz
          ls -la
          TAG="${{ inputs.release_tag || 'v0.1.0-alpha.5' }}"
          VERSION="${TAG#v}"
          echo "GMAT_DIR=GMAT-Qt-$VERSION-linux-x86_64" >> $GITHUB_ENV
          
      - name: Start Xvfb with XFCE desktop
        run: |
          # Start Xvfb with a good resolution
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          sleep 2
          
          # Start XFCE window manager for proper window management
          xfwm4 &
          sleep 2
          
          # Start XFCE panel for desktop chrome
          xfce4-panel &
          sleep 2
          
          # Set software OpenGL
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_GL_VERSION_OVERRIDE=3.3
          
          echo "DISPLAY=:99" >> $GITHUB_ENV
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> $GITHUB_ENV
          echo "MESA_GL_VERSION_OVERRIDE=3.3" >> $GITHUB_ENV
          
      - name: Launch GMAT-Qt and capture screenshot
        run: |
          cd "$GMAT_DIR"
          
          # Modify the tutorial script to replace OpenFramesInterface with OrbitView
          echo "Creating modified tutorial script..."
          cp samples/Tut_Mars_B_Plane_Targeting.script /tmp/tutorial_modified.script
          
          # Replace OpenFramesInterface with OrbitView in the script
          sed -i 's/OpenFramesInterface/OrbitView/g' /tmp/tutorial_modified.script
          sed -i 's/Create OpenFramesView/Create OrbitView/g' /tmp/tutorial_modified.script
          
          echo "Modified script created"
          
          # Launch GMAT-Qt with modified script
          echo "Launching GMAT-Qt..."
          ./run-gmat /tmp/tutorial_modified.script &
          GMAT_PID=$!
          
          # Wait for window
          echo "Waiting for GMAT window..."
          for i in {1..30}; do
            if xdotool search --name "GMAT" > /dev/null 2>&1; then
              echo "GMAT window appeared after ${i} seconds"
              break
            fi
            sleep 1
          done
          sleep 3
          
          # Log windows
          echo "=== All windows ==="
          wmctrl -l
          
          # Find and maximize main window
          GMAT_WINDOW=$(xdotool search --name "GMAT" | head -1)
          if [ -n "$GMAT_WINDOW" ]; then
            echo "Main window: $GMAT_WINDOW"
            xdotool windowactivate $GMAT_WINDOW
            wmctrl -i -r $GMAT_WINDOW -b add,maximized_vert,maximized_horz
            sleep 2
            
            # Build (F7) and Run (F5)
            echo "Building (F7)..."
            xdotool key F7
            sleep 8
            
            echo "Running (F5)..."
            xdotool key F5
            sleep 25
          fi
          
          # Log windows after
          echo "=== Windows after run ==="
          wmctrl -l
          
          # Take screenshot
          scrot -o /tmp/screenshot-linux.png
          echo "Screenshot captured"
          
          # OCR verification
          echo "=== OCR Verification ==="
          tesseract /tmp/screenshot-linux.png - 2>/dev/null | head -50
          
          OCR_TEXT=$(tesseract /tmp/screenshot-linux.png - 2>/dev/null)
          if echo "$OCR_TEXT" | grep -i "Convert OpenFrames"; then
            echo "ERROR: Convert dialog still present!"
            exit 1
          fi
          if echo "$OCR_TEXT" | grep -i "Build this script to update them"; then
            echo "ERROR: Script not built or run!"
            exit 1
          fi
          
          echo "OCR verification passed"
          
          # Kill GMAT
          kill $GMAT_PID || true
          wait $GMAT_PID 2>/dev/null || true
          
      - name: Upload Linux screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-linux-x86_64
          path: /tmp/screenshot-linux.png
          retention-days: 30

  screenshot-windows:
    name: Screenshot Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Install tesseract OCR
        shell: pwsh
        run: |
          choco install tesseract -y
          $env:PATH = "C:\Program Files\Tesseract-OCR;$env:PATH"
          
      - name: Download Windows release package
        shell: pwsh
        run: |
          $tag = "${{ inputs.release_tag || 'v0.1.0-alpha.5' }}"
          $version = $tag.TrimStart('v')
          $url = "https://github.com/dcajacob/GMAT-Qt/releases/download/$tag/GMAT-Qt-$version-windows-x64.zip"
          Write-Host "Downloading from: $url"
          Invoke-WebRequest -Uri $url -OutFile gmat-qt.zip
          
      - name: Extract package
        shell: pwsh
        run: |
          Expand-Archive -Path gmat-qt.zip -DestinationPath .
          Get-ChildItem
          $tag = "${{ inputs.release_tag || 'v0.1.0-alpha.5' }}"
          $version = $tag.TrimStart('v')
          $gmatDir = "GMAT-Qt-$version-windows-x64"
          "GMAT_DIR=$gmatDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          
      - name: Set display resolution to 1920x1080
        shell: pwsh
        run: |
          # Try to set resolution to 1920x1080
          try {
            Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction SilentlyContinue
            Write-Host "Set resolution to 1920x1080"
          } catch {
            Write-Host "Could not set resolution, using default"
          }
          Start-Sleep -Seconds 2
          
      - name: Launch GMAT-Qt and capture screenshot
        shell: pwsh
        run: |
          $gmatDir = $env:GMAT_DIR
          Set-Location $gmatDir
          
          # Modify tutorial script to replace OpenFramesInterface with OrbitView
          Write-Host "Creating modified tutorial script..."
          $scriptContent = Get-Content "samples\Tut_Mars_B_Plane_Targeting.script" -Raw
          $scriptContent = $scriptContent -replace 'OpenFramesInterface','OrbitView'
          $scriptContent = $scriptContent -replace 'Create OpenFramesView','Create OrbitView'
          $scriptContent | Set-Content "$env:TEMP\tutorial_modified.script"
          Write-Host "Modified script created"
          
          # Launch GMAT-Qt with modified script
          Write-Host "Launching GMAT-Qt..."
          $process = Start-Process -FilePath ".\bin\GmatQt.exe" -ArgumentList "$env:TEMP\tutorial_modified.script" -PassThru -WindowStyle Maximized
          Start-Sleep -Seconds 10
          
          # Log windows
          Write-Host "=== Current windows ==="
          Get-Process | Where-Object {$_.MainWindowTitle} | Select-Object Id, ProcessName, MainWindowTitle | Format-Table -AutoSize
          
          # Send F7 (Build) and F5 (Run)
          Add-Type -AssemblyName System.Windows.Forms
          $sig = @'
          [DllImport("user32.dll")]
          public static extern bool SetForegroundWindow(IntPtr hWnd);
          '@
          $winAPI = Add-Type -MemberDefinition $sig -Name WinAPI -PassThru
          
          $winAPI::SetForegroundWindow($process.MainWindowHandle)
          Start-Sleep -Seconds 2
          
          Write-Host "Building (F7)..."
          [System.Windows.Forms.SendKeys]::SendWait("{F7}")
          Start-Sleep -Seconds 8
          
          Write-Host "Running (F5)..."
          [System.Windows.Forms.SendKeys]::SendWait("{F5}")
          Start-Sleep -Seconds 25
          
          # Log windows after
          Write-Host "=== Windows after run ==="
          Get-Process | Where-Object {$_.MainWindowTitle} | Select-Object MainWindowTitle | Format-Table
          
          # Take screenshot
          Add-Type -AssemblyName System.Drawing
          $screens = [Windows.Forms.Screen]::AllScreens
          $screen = $screens[0]
          Write-Host "Screen resolution: $($screen.Bounds.Width)x$($screen.Bounds.Height)"
          $bitmap = New-Object Drawing.Bitmap $screen.Bounds.Width, $screen.Bounds.Height
          $graphics = [Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($screen.Bounds.Location, [Drawing.Point]::Empty, $screen.Bounds.Size)
          $bitmap.Save("$env:TEMP\screenshot-windows.png")
          $graphics.Dispose()
          $bitmap.Dispose()
          Write-Host "Screenshot captured"
          
          # OCR verification
          Write-Host "=== OCR Verification ==="
          $env:PATH = "C:\Program Files\Tesseract-OCR;$env:PATH"
          & tesseract "$env:TEMP\screenshot-windows.png" stdout 2>$null | Select-Object -First 50
          
          $ocrText = & tesseract "$env:TEMP\screenshot-windows.png" stdout 2>$null
          if ($ocrText -match "Convert OpenFrames") {
            Write-Host "ERROR: Convert dialog still present!"
            exit 1
          }
          if ($ocrText -match "Build this script to update them") {
            Write-Host "ERROR: Script not built or run!"
            exit 1
          }
          
          Write-Host "OCR verification passed"
          
          # Stop GMAT
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          
          # Move screenshot
          Move-Item "$env:TEMP\screenshot-windows.png" ..\screenshot-windows.png
          
      - name: Upload Windows screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-windows-x64
          path: screenshot-windows.png
          retention-days: 30

  screenshot-macos-arm64:
    name: Screenshot macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Install tesseract OCR
        run: |
          brew install tesseract
          
      - name: Download macOS ARM64 release package
        run: |
          TAG="${{ inputs.release_tag || 'v0.1.0-alpha.5' }}"
          VERSION="${TAG#v}"
          curl -L -o gmat-qt.zip \
            "https://github.com/dcajacob/GMAT-Qt/releases/download/$TAG/GMAT-Qt-$VERSION-macos-arm64.zip"
          
      - name: Extract package
        run: |
          unzip gmat-qt.zip
          ls -la
          TAG="${{ inputs.release_tag || 'v0.1.0-alpha.5' }}"
          VERSION="${TAG#v}"
          echo "GMAT_DIR=GMAT-Qt-$VERSION-macos-arm64" >> $GITHUB_ENV
          
      - name: Handle quarantine and signature
        run: |
          cd "$GMAT_DIR"
          xattr -cr GMAT-Qt.app
          
      - name: Launch GMAT-Qt and capture screenshot
        run: |
          cd "$GMAT_DIR"
          
          # Modify tutorial script to replace OpenFramesInterface with OrbitView
          echo "Creating modified tutorial script..."
          cp samples/Tut_Mars_B_Plane_Targeting.script /tmp/tutorial_modified.script
          sed -i '' 's/OpenFramesInterface/OrbitView/g' /tmp/tutorial_modified.script
          sed -i '' 's/Create OpenFramesView/Create OrbitView/g' /tmp/tutorial_modified.script
          echo "Modified script created"
          
          # Launch GMAT-Qt
          echo "Launching GMAT-Qt..."
          ./GMAT-Qt.app/Contents/MacOS/GmatQt /tmp/tutorial_modified.script &
          GMAT_PID=$!
          
          # Wait for window
          echo "Waiting for GMAT window..."
          for i in {1..30}; do
            if osascript -e 'tell application "System Events" to exists (first process whose name is "GmatQt")' 2>/dev/null; then
              echo "GmatQt found after ${i} seconds"
              break
            fi
            sleep 1
          done
          sleep 3
          
          # Log windows
          echo "=== Window titles ==="
          osascript -e 'tell application "System Events" to get name of every window of every process' 2>/dev/null | head -20 || true
          
          # Build and Run with AppleScript
          osascript <<'EOF' || true
          tell application "System Events"
            set gmatProcess to first process whose name is "GmatQt"
            set frontmost of gmatProcess to true
            delay 2
            
            -- Build (F7 = key code 98)
            key code 98
            delay 8
            
            -- Run (F5 = key code 96)
            key code 96
            delay 25
          end tell
          EOF
          
          # Log windows after
          echo "=== Windows after run ==="
          osascript -e 'tell application "System Events" to get name of every window of (first process whose name is "GmatQt")' 2>/dev/null || true
          
          # Take screenshot
          screencapture -x /tmp/screenshot-macos-arm64.png
          echo "Screenshot captured"
          
          # OCR verification
          echo "=== OCR Verification ==="
          tesseract /tmp/screenshot-macos-arm64.png - 2>/dev/null | head -50 || true
          
          OCR_TEXT=$(tesseract /tmp/screenshot-macos-arm64.png - 2>/dev/null || true)
          if echo "$OCR_TEXT" | grep -i "Convert OpenFrames"; then
            echo "ERROR: Convert dialog still present!"
            exit 1
          fi
          if echo "$OCR_TEXT" | grep -i "Build this script to update them"; then
            echo "ERROR: Script not built or run!"
            exit 1
          fi
          
          echo "OCR verification passed"
          
          # Kill GMAT
          kill $GMAT_PID 2>/dev/null || pkill -f "GmatQt" || true
          
      - name: Upload macOS ARM64 screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-macos-arm64
          path: /tmp/screenshot-macos-arm64.png
          retention-days: 30

  combine-screenshots:
    name: Combine all screenshots
    runs-on: ubuntu-latest
    needs: [screenshot-linux, screenshot-windows, screenshot-macos-arm64]
    if: always()
    steps:
      - name: Download all screenshots
        uses: actions/download-artifact@v4
        with:
          path: screenshots
          
      - name: Create combined archive
        run: |
          cd screenshots
          find . -name "*.png" -exec mv {} . \;
          ls -la
          zip -r ../screenshots-combined.zip *.png
          
      - name: Upload combined screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-combined
          path: screenshots-combined.zip
          retention-days: 30
