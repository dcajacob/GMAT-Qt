name: Marketing Screenshots

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to capture screenshots from'
        required: true
        default: 'v0.1.0-alpha.5'
        type: string

permissions:
  contents: read

jobs:
  screenshot-linux:
    name: Screenshot Linux x86-64
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Install desktop environment and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            xfce4 \
            xfce4-terminal \
            xfwm4 \
            scrot \
            mesa-utils \
            libgl1-mesa-dri \
            libglx-mesa0 \
            wget \
            imagemagick \
            wmctrl \
            x11-utils
          
      - name: Download Linux release package
        run: |
          TAG="${{ inputs.release_tag || 'v0.1.0-alpha.5' }}"
          VERSION="${TAG#v}"
          wget -O gmat-qt.tar.gz \
            "https://github.com/dcajacob/GMAT-Qt/releases/download/$TAG/GMAT-Qt-$VERSION-linux-x86_64.tar.gz"
          
      - name: Extract package
        run: |
          tar -xzf gmat-qt.tar.gz
          ls -la
          TAG="${{ inputs.release_tag || 'v0.1.0-alpha.5' }}"
          VERSION="${TAG#v}"
          echo "GMAT_DIR=GMAT-Qt-$VERSION-linux-x86_64" >> $GITHUB_ENV
          
      - name: Start Xvfb with XFCE desktop
        run: |
          # Start Xvfb with a good resolution
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          sleep 2
          
          # Start XFCE window manager for proper window management
          xfwm4 &
          sleep 2
          
          # Start XFCE panel for desktop chrome
          xfce4-panel &
          sleep 2
          
          # Set software OpenGL
          export LIBGL_ALWAYS_SOFTWARE=1
          export MESA_GL_VERSION_OVERRIDE=3.3
          
          echo "DISPLAY=:99" >> $GITHUB_ENV
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> $GITHUB_ENV
          echo "MESA_GL_VERSION_OVERRIDE=3.3" >> $GITHUB_ENV
          
      - name: Launch GMAT-Qt and capture screenshot
        run: |
          cd "$GMAT_DIR"
          
          # Install xdotool for GUI automation
          sudo apt-get install -y xdotool
          
          # Launch GMAT-Qt with the tutorial script
          ./run-gmat samples/Tut_Mars_B_Plane_Targeting.script &
          GMAT_PID=$!
          
          # Wait for main window to appear
          echo "Waiting for GMAT main window..."
          for i in {1..20}; do
            if xdotool search --name "GMAT" > /dev/null 2>&1; then
              echo "GMAT window appeared after ${i} seconds"
              break
            fi
            sleep 1
          done
          sleep 2
          
          # Log all windows
          echo "=== Current windows ==="
          wmctrl -l || true
          xdotool search --name "" getwindowname %@ || true
          
          # Find and activate GMAT main window
          GMAT_WINDOW=$(xdotool search --name "GMAT" | head -1)
          if [ -n "$GMAT_WINDOW" ]; then
            echo "Activating GMAT window: $GMAT_WINDOW"
            xdotool windowactivate $GMAT_WINDOW
            sleep 1
            
            # Maximize the window
            wmctrl -i -r $GMAT_WINDOW -b add,maximized_vert,maximized_horz
            sleep 1
            
            # Handle "Convert OpenFrames views?" dialog if present
            echo "Checking for Convert dialog..."
            DIALOG_WINDOW=$(xdotool search --name "Convert" 2>/dev/null | head -1)
            if [ -n "$DIALOG_WINDOW" ]; then
              echo "Found Convert dialog, clicking Convert views button"
              xdotool windowactivate $DIALOG_WINDOW
              sleep 1
              # Press Tab to focus first button, then Enter (or just press Alt+C for Convert)
              xdotool key alt+c
              sleep 2
            fi
            
            # Activate main window again
            xdotool windowactivate $GMAT_WINDOW
            sleep 1
            
            # Press F7 to Build
            echo "Building mission (F7)..."
            xdotool key F7
            sleep 8
            
            # Press F5 to Run
            echo "Running mission (F5)..."
            xdotool key F5
            sleep 20
            
            # Log windows again to verify plot windows appeared
            echo "=== Windows after run ==="
            wmctrl -l || true
            
          else
            echo "ERROR: Could not find GMAT window"
          fi
          
          # Take full screenshot
          sleep 2
          scrot -o /tmp/screenshot-linux.png
          echo "Screenshot captured"
          
          # Kill GMAT
          kill $GMAT_PID || true
          wait $GMAT_PID 2>/dev/null || true
          
      - name: Upload Linux screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-linux-x86_64
          path: /tmp/screenshot-linux.png
          retention-days: 30

  screenshot-windows:
    name: Screenshot Windows x64
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download Windows release package
        shell: pwsh
        run: |
          $tag = "${{ inputs.release_tag || 'v0.1.0-alpha.5' }}"
          $version = $tag.TrimStart('v')
          $url = "https://github.com/dcajacob/GMAT-Qt/releases/download/$tag/GMAT-Qt-$version-windows-x64.zip"
          Write-Host "Downloading from: $url"
          Invoke-WebRequest -Uri $url -OutFile gmat-qt.zip
          
      - name: Extract package
        shell: pwsh
        run: |
          Expand-Archive -Path gmat-qt.zip -DestinationPath .
          Get-ChildItem
          $tag = "${{ inputs.release_tag || 'v0.1.0-alpha.5' }}"
          $version = $tag.TrimStart('v')
          $gmatDir = "GMAT-Qt-$version-windows-x64"
          "GMAT_DIR=$gmatDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          
      - name: Set display resolution to 1920x1080
        shell: pwsh
        run: |
          # Try to set resolution to 1920x1080
          try {
            Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction SilentlyContinue
            Write-Host "Set resolution to 1920x1080"
          } catch {
            Write-Host "Could not set resolution, using default"
          }
          Start-Sleep -Seconds 2
          
      - name: Launch GMAT-Qt and capture screenshot
        shell: pwsh
        run: |
          $gmatDir = $env:GMAT_DIR
          Set-Location $gmatDir
          
          # Launch GMAT-Qt with the tutorial script
          $process = Start-Process -FilePath ".\bin\GmatQt.exe" -ArgumentList "samples\Tut_Mars_B_Plane_Targeting.script" -PassThru -WindowStyle Maximized
          
          # Wait for window to appear
          Write-Host "Waiting for GMAT window..."
          Start-Sleep -Seconds 10
          
          # Setup automation
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName UIAutomationClient
          $sig = @'
          [DllImport("user32.dll")]
          public static extern bool ShowWindow(IntPtr hWnd, int nCmdShow);
          [DllImport("user32.dll")]
          public static extern bool SetForegroundWindow(IntPtr hWnd);
          [DllImport("user32.dll", SetLastError = true)]
          public static extern IntPtr FindWindow(string lpClassName, string lpWindowName);
          '@
          $winAPI = Add-Type -MemberDefinition $sig -Name WindowAPI -PassThru
          
          # Log window title
          if ($process.MainWindowHandle -ne [IntPtr]::Zero) {
            Write-Host "Main window handle: $($process.MainWindowHandle)"
            Write-Host "Main window title: $($process.MainWindowTitle)"
          }
          
          # Bring to foreground
          $winAPI::SetForegroundWindow($process.MainWindowHandle)
          Start-Sleep -Seconds 2
          
          # Check for Convert dialog and handle it
          Write-Host "Checking for Convert dialog..."
          $convertWindow = $winAPI::FindWindow($null, "Convert OpenFrames views?")
          if ($convertWindow -ne [IntPtr]::Zero) {
            Write-Host "Found Convert dialog, sending Alt+C"
            $winAPI::SetForegroundWindow($convertWindow)
            Start-Sleep -Seconds 1
            [System.Windows.Forms.SendKeys]::SendWait("%c")
            Start-Sleep -Seconds 2
          }
          
          # Bring main window back to front
          $winAPI::SetForegroundWindow($process.MainWindowHandle)
          Start-Sleep -Seconds 1
          
          # Build the mission (F7)
          Write-Host "Building mission (F7)..."
          [System.Windows.Forms.SendKeys]::SendWait("{F7}")
          Start-Sleep -Seconds 8
          
          # Run the mission (F5)
          Write-Host "Running mission (F5)..."
          [System.Windows.Forms.SendKeys]::SendWait("{F5}")
          Start-Sleep -Seconds 20
          
          Write-Host "Windows after run:"
          Get-Process | Where-Object {$_.MainWindowTitle} | Select-Object MainWindowTitle | Format-Table
          
          # Take screenshot
          Add-Type -AssemblyName System.Drawing
          $screens = [Windows.Forms.Screen]::AllScreens
          $screen = $screens[0]
          Write-Host "Screen resolution: $($screen.Bounds.Width)x$($screen.Bounds.Height)"
          $bitmap = New-Object Drawing.Bitmap $screen.Bounds.Width, $screen.Bounds.Height
          $graphics = [Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($screen.Bounds.Location, [Drawing.Point]::Empty, $screen.Bounds.Size)
          $bitmap.Save("$env:TEMP\screenshot-windows.png")
          $graphics.Dispose()
          $bitmap.Dispose()
          Write-Host "Screenshot captured"
          
          # Stop GMAT
          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          
          # Move screenshot to known location
          Move-Item "$env:TEMP\screenshot-windows.png" ..\screenshot-windows.png
          
      - name: Upload Windows screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-windows-x64
          path: screenshot-windows.png
          retention-days: 30

  screenshot-macos-arm64:
    name: Screenshot macOS Apple Silicon
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Download macOS ARM64 release package
        run: |
          TAG="${{ inputs.release_tag || 'v0.1.0-alpha.5' }}"
          VERSION="${TAG#v}"
          curl -L -o gmat-qt.zip \
            "https://github.com/dcajacob/GMAT-Qt/releases/download/$TAG/GMAT-Qt-$VERSION-macos-arm64.zip"
          
      - name: Extract package
        run: |
          unzip gmat-qt.zip
          ls -la
          TAG="${{ inputs.release_tag || 'v0.1.0-alpha.5' }}"
          VERSION="${TAG#v}"
          echo "GMAT_DIR=GMAT-Qt-$VERSION-macos-arm64" >> $GITHUB_ENV
          
      - name: Handle quarantine and signature
        run: |
          cd "$GMAT_DIR"
          # Remove quarantine attribute
          xattr -cr GMAT-Qt.app
          
      - name: Launch GMAT-Qt and capture screenshot
        run: |
          cd "$GMAT_DIR"
          
          # Launch GMAT-Qt with the tutorial script using direct executable path
          # This avoids Finder/open issues
          echo "Launching GMAT-Qt..."
          ./GMAT-Qt.app/Contents/MacOS/GmatQt "samples/Tut_Mars_B_Plane_Targeting.script" &
          GMAT_PID=$!
          
          # Wait for window to appear
          echo "Waiting for GMAT window..."
          for i in {1..30}; do
            if osascript -e 'tell application "System Events" to exists (first process whose name is "GmatQt")' 2>/dev/null; then
              echo "GmatQt process found after ${i} seconds"
              break
            fi
            sleep 1
          done
          sleep 3
          
          # Log running processes
          echo "=== Running processes with GmatQt ==="
          ps aux | grep -i gmat || true
          
          # Log window info
          echo "=== Window titles ==="
          osascript -e 'tell application "System Events" to get name of every window of every process' || true
          
          # Bring GMAT to front and handle Convert dialog
          osascript <<'EOF' || true
          tell application "System Events"
            -- Find GmatQt process
            set gmatProcess to first process whose name is "GmatQt"
            set frontmost of gmatProcess to true
            delay 2
            
            -- Check for Convert dialog by looking for button "Convert views"
            try
              tell gmatProcess
                if exists button "Convert views" of window 1 then
                  log "Found Convert dialog, clicking Convert views"
                  click button "Convert views" of window 1
                  delay 2
                end if
              end tell
            end try
            
            -- Make sure main window is front
            set frontmost of gmatProcess to true
            delay 1
            
            -- Build (F7 = key code 98)
            log "Building mission (F7)..."
            key code 98
            delay 8
            
            -- Run (F5 = key code 96)
            log "Running mission (F5)..."
            key code 96
            delay 20
            
          end tell
          EOF
          
          echo "Automation complete"
          
          # Log windows again
          echo "=== Windows after run ==="
          osascript -e 'tell application "System Events" to get name of every window of (first process whose name is "GmatQt")' || true
          
          # Take full-screen screenshot
          sleep 2
          screencapture -x /tmp/screenshot-macos-arm64.png
          echo "Screenshot captured"
          
          # Kill GMAT-Qt
          kill $GMAT_PID 2>/dev/null || pkill -f "GmatQt" || true
          
      - name: Upload macOS ARM64 screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-macos-arm64
          path: /tmp/screenshot-macos-arm64.png
          retention-days: 30

  screenshot-macos-intel:
    name: Screenshot macOS Intel
    runs-on: macos-15-large
    timeout-minutes: 20
    steps:
      - name: Download macOS Intel release package
        run: |
          TAG="${{ inputs.release_tag || 'v0.1.0-alpha.5' }}"
          VERSION="${TAG#v}"
          curl -L -o gmat-qt.zip \
            "https://github.com/dcajacob/GMAT-Qt/releases/download/$TAG/GMAT-Qt-$VERSION-macos-x64.zip"
          
      - name: Extract package
        run: |
          unzip gmat-qt.zip
          ls -la
          TAG="${{ inputs.release_tag || 'v0.1.0-alpha.5' }}"
          VERSION="${TAG#v}"
          echo "GMAT_DIR=GMAT-Qt-$VERSION-macos-x64" >> $GITHUB_ENV
          
      - name: Handle quarantine and signature
        run: |
          cd "$GMAT_DIR"
          # Remove quarantine attribute
          xattr -cr GMAT-Qt.app
          
      - name: Launch GMAT-Qt and capture screenshot
        run: |
          cd "$GMAT_DIR"
          
          # Launch GMAT-Qt with the tutorial script using direct executable path
          echo "Launching GMAT-Qt..."
          ./GMAT-Qt.app/Contents/MacOS/GmatQt "samples/Tut_Mars_B_Plane_Targeting.script" &
          GMAT_PID=$!
          
          # Wait for window to appear
          echo "Waiting for GMAT window..."
          for i in {1..30}; do
            if osascript -e 'tell application "System Events" to exists (first process whose name is "GmatQt")' 2>/dev/null; then
              echo "GmatQt process found after ${i} seconds"
              break
            fi
            sleep 1
          done
          sleep 3
          
          # Log running processes
          echo "=== Running processes with GmatQt ==="
          ps aux | grep -i gmat || true
          
          # Log window info
          echo "=== Window titles ==="
          osascript -e 'tell application "System Events" to get name of every window of every process' || true
          
          # Bring GMAT to front and handle Convert dialog
          osascript <<'EOF' || true
          tell application "System Events"
            -- Find GmatQt process
            set gmatProcess to first process whose name is "GmatQt"
            set frontmost of gmatProcess to true
            delay 2
            
            -- Check for Convert dialog by looking for button "Convert views"
            try
              tell gmatProcess
                if exists button "Convert views" of window 1 then
                  log "Found Convert dialog, clicking Convert views"
                  click button "Convert views" of window 1
                  delay 2
                end if
              end tell
            end try
            
            -- Make sure main window is front
            set frontmost of gmatProcess to true
            delay 1
            
            -- Build (F7 = key code 98)
            log "Building mission (F7)..."
            key code 98
            delay 8
            
            -- Run (F5 = key code 96)
            log "Running mission (F5)..."
            key code 96
            delay 20
            
          end tell
          EOF
          
          echo "Automation complete"
          
          # Log windows again
          echo "=== Windows after run ==="
          osascript -e 'tell application "System Events" to get name of every window of (first process whose name is "GmatQt")' || true
          
          # Take full-screen screenshot
          sleep 2
          screencapture -x /tmp/screenshot-macos-x64.png
          echo "Screenshot captured"
          
          # Kill GMAT-Qt
          kill $GMAT_PID 2>/dev/null || pkill -f "GmatQt" || true
          
      - name: Upload macOS Intel screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-macos-x64
          path: /tmp/screenshot-macos-x64.png
          retention-days: 30

  combine-screenshots:
    name: Combine all screenshots
    runs-on: ubuntu-latest
    needs: [screenshot-linux, screenshot-windows, screenshot-macos-arm64, screenshot-macos-intel]
    if: always()
    steps:
      - name: Download all screenshots
        uses: actions/download-artifact@v4
        with:
          path: screenshots
          
      - name: Create combined archive
        run: |
          cd screenshots
          find . -name "*.png" -exec mv {} . \;
          ls -la
          zip -r ../screenshots-combined.zip *.png
          
      - name: Upload combined screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-combined
          path: screenshots-combined.zip
          retention-days: 30
