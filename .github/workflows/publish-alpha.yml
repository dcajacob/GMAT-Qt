name: Publish alpha release

on:
  push:
    branches: ['codex/publish-alpha-0.1.0-alpha.4']

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-gmat-qt-alpha-0.1.0-alpha.4
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download qualified Linux archive
        uses: actions/download-artifact@v4
        with:
          name: alpha4-linux-x86_64
          run-id: 43652888697
          github-token: ${{ github.token }}
          path: build/publish-alpha/linux-x86_64
      - name: Download qualified Windows archive
        uses: actions/download-artifact@v4
        with:
          name: alpha4-windows-x64
          run-id: 43652888697
          github-token: ${{ github.token }}
          path: build/publish-alpha/windows-x64
      - name: Download qualified Apple Silicon archive
        uses: actions/download-artifact@v4
        with:
          name: alpha4-macos-arm64
          run-id: 43652888697
          github-token: ${{ github.token }}
          path: build/publish-alpha/macos-arm64
      - name: Download qualified Intel Mac archive
        uses: actions/download-artifact@v4
        with:
          name: alpha4-macos-x64
          run-id: 43652888697
          github-token: ${{ github.token }}
          path: build/publish-alpha/macos-x64
      - name: Verify and publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/preview/PublishAlphaRelease.py
      - name: Preserve publication receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha4-publication-receipt
          path: build/publish-alpha/*.json
          if-no-files-found: warn
          retention-days: 90
