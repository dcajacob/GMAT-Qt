name: Qt preview Windows producer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: package (windows-2022, windows-x64)
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Restore Windows dependency SDK
        id: windows-sdk
        uses: actions/cache/restore@v4
        with:
          path: |
            build/preview-package/deps/osg
            C:\vcpkg\installed
          key: gmat-qt-preview-windows-2022-osg365-sdk-v1
      - name: Build and verify portable package
        run: python tools/preview/BuildPreviewPackage.py --platform windows-x64
      - name: Preserve build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-windows-x64
          path: build/preview-package/logs/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve completed Windows dependency SDK
        if: always() && steps.windows-sdk.outputs.cache-hit != 'true' && hashFiles('build/preview-package/deps/osg/preview-sdk-sha256.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            build/preview-package/deps/osg
            C:\vcpkg\installed
          key: gmat-qt-preview-windows-2022-osg365-sdk-v1
      - name: Preserve compiled native inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-inputs-windows-x64
          path: build/preview-package/native-inputs-*.tar.gz
          if-no-files-found: ignore
          retention-days: 3
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: package-windows-x64
          path: build/preview-package/dist/*
          if-no-files-found: error
          retention-days: 30
