name: OEM Hermite targeted qualification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/oem-hermite.yml'
      - 'tools/preview/OemHermiteSuite.json'
      - 'tools/preview/RunSharedSuite.py'
      - 'tools/preview/BuildPreviewPackage.py'
      - 'CMakeLists.txt'
      - 'src/qtgui/CMakeLists.txt'
      - 'src/qtgui/EphemerisDialog.*'
      - 'src/qtgui/ResourceEditor.*'
      - 'src/qtgui/ResourceForm.*'
      - 'src/qtgui/tests/*Oem*'
      - 'src/qtgui/tests/NasaEphemerisDirectionTests.cpp'
      - 'src/qtgui/tests/InterpolationSufficiencyTests.cpp'
      - 'src/qtgui/tests/RunTest.py'
      - 'src/qtgui/tests/AcceptanceRuntime.py'
      - 'src/qtgui/tests/AcceptancePlatform.hpp'
      - 'src/qtgui/tests/AcceptanceView.hpp'
      - 'src/qtgui/tests/TestSettings.hpp'
      - 'src/base/function/GetEphemStates.*'
      - 'src/base/executive/Publisher.*'
      - 'src/base/subscriber/Ephemeris*'
      - 'src/base/subscriber/EphemWriterCCSDS.*'
      - 'src/base/subscriber/EphemWriterWithInterpolator.*'
      - 'src/base/subscriber/IntegrationStepSampler.hpp'
      - 'src/gmatutil/util/CCSDSEM*'
      - 'src/gmatutil/util/CCSDSEphemerisFile.*'
      - 'src/gmatutil/util/CCSDSOEM*'
      - 'src/gmatutil/util/CcsdsOem*'
      - 'src/gmatutil/util/Ephemeris.*'
      - 'src/gmatutil/util/interpolator/Interpolator.*'
      - 'src/gmatutil/util/interpolator/HermiteInterpolator.*'
      - 'src/gmatutil/util/interpolator/LagrangeInterpolator.*'
      - 'plugins/EphemPropagatorPlugin/src/base/propagator/CcsdsEphPropagator.*'
      - 'plugins/EphemPropagatorPlugin/src/base/propagator/EphemerisPropagator.*'
  push:
    branches: ['codex/oem-hermite']
  workflow_dispatch:
    inputs:
      platform:
        description: Platform requiring new or affected checks
        type: choice
        default: all
        options: [all, windows-x64, macos-arm64, macos-x64]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qualify:
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON((inputs.platform == 'windows-x64' || contains(github.event.head_commit.message, '[windows-only]')) &&
          '[{"runner":"windows-2022","platform":"windows-x64"}]' ||
          inputs.platform == 'macos-arm64' &&
          '[{"runner":"macos-15","platform":"macos-arm64"}]' ||
          inputs.platform == 'macos-x64' &&
          '[{"runner":"macos-15-intel","platform":"macos-x64"}]' ||
          '[{"runner":"windows-2022","platform":"windows-x64"},
          {"runner":"macos-15","platform":"macos-arm64"},
          {"runner":"macos-15-intel","platform":"macos-x64"}]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore Windows graphics SDK
        if: matrix.platform == 'windows-x64'
        id: windows-sdk
        uses: actions/cache/restore@v4
        with:
          path: |
            build/preview-package/deps/osg
            C:\vcpkg\installed
          key: gmat-qt-preview-windows-2022-osg365-sdk-v1
      - name: Build release configuration and run the six targeted cases
        run: python tools/preview/RunSharedSuite.py --platform ${{ matrix.platform }} --python-api --plan tools/preview/OemHermiteSuite.json --output build/oem-hermite-platforms/${{ matrix.platform }}
      - name: Preserve results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oem-hermite-${{ matrix.platform }}
          path: |
            build/oem-hermite-platforms/${{ matrix.platform }}/
            build/preview-package/logs/
            build/preview-package/native-build-context.json
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve matching compiled API and GUI
        if: always() && github.event_name != 'pull_request' && hashFiles('build/preview-package/native-inputs-api-py312-v2-*.tar.gz') != ''
        uses: actions/upload-artifact@v4
        with:
          name: oem-hermite-native-${{ matrix.platform }}
          path: build/preview-package/native-inputs-api-py312-v2-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Preserve completed Windows SDK
        if: always() && matrix.platform == 'windows-x64' && steps.windows-sdk.outputs.cache-hit != 'true' && hashFiles('build/preview-package/deps/osg/preview-sdk-sha256.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            build/preview-package/deps/osg
            C:\vcpkg\installed
          key: gmat-qt-preview-windows-2022-osg365-sdk-v1
